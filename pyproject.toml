[project]
name = "job-radar"
version = "0.1.0"
description = "CLI tool to streamline healthcare software job searches"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "PyYAML>=6.0",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[project.scripts]
job-radar = "job_radar.cli:main"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

extend-select = [
    "D100",  # Missing module docstring
    "D103",  # Missing public function docstring
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

