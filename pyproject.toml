[project]
name = "pathology-extraction"
version = "0.2.0"
description = "Structured field extraction from unstructured pathology reports"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.141",
    "groq>=0.9",
    "pandas>=2.0",
    "pdfplumber>=0.10",
    "pydantic>=2.0",
    "sentence-transformers>=3.0",
    "univcorn>=0.52",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

extend-select = [
    "D100",  # Missing module docstring
    "D103",  # Missing public function docstring
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"